<text x="677.5400000000002" y="277" fill="#f5eeda" font-family="ui-monospace, monospace" font-size="12">262.74</text>
<text x="190" y="368" fill="#7f9187" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Player −4.98 points; win rate 50.0% → 46.0% (the exact paired edge is +0.43 pp at round 12).</text>
