<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img" aria-labelledby="title2 desc2">
<title id="title2">Match-W score cost over 100 games</title>
<desc id="desc2">Mean score for the Exact-W control and the Match-W hybrid in 100 seeded games. The hybrid player gives up about five points.</desc>
<rect width="920" height="380" fill="#10251d"/>
<text x="190" y="42" fill="#f5eeda" font-family="Georgia, serif" font-size="24">The score cost of playing for the match</text>
<text x="190" y="66" fill="#a4b3a8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">100 seeded games. Match-W switches at round 12; the CPU always uses Exact-W.</text>
<line x1="190" y1="76" x2="190" y2="330" stroke="rgba(245,238,218,0.12)" stroke-width="1"/>
<text x="190" y="350" fill="#7f9187" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10">240</text>
<line x1="295" y1="76" x2="295" y2="330" stroke="rgba(245,238,218,0.12)" stroke-width="1"/>
<text x="295" y="350" fill="#7f9187" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10">245</text>
<line x1="400" y1="76" x2="400" y2="330" stroke="rgba(245,238,218,0.24)" stroke-width="1"/>
<text x="400" y="350" fill="#7f9187" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10">250</text>
<line x1="505" y1="76" x2="505" y2="330" stroke="rgba(245,238,218,0.12)" stroke-width="1"/>
<text x="505" y="350" fill="#7f9187" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10">255</text>
<line x1="610" y1="76" x2="610" y2="330" stroke="rgba(245,238,218,0.12)" stroke-width="1"/>
<text x="610" y="350" fill="#7f9187" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10">260</text>
<line x1="715" y1="76" x2="715" y2="330" stroke="rgba(245,238,218,0.12)" stroke-width="1"/>
<text x="715" y="350" fill="#7f9187" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10">265</text>
<line x1="820" y1="76" x2="820" y2="330" stroke="rgba(245,238,218,0.12)" stroke-width="1"/>
<text x="820" y="350" fill="#7f9187" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10">270</text>
<text x="176" y="102" fill="#f5eeda" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Exact-W control · player</text>
<rect x="190" y="86" width="276.78000000000014" height="24" rx="4" fill="#a4b3a8" opacity="0.82"/>
<text x="476.78000000000014" y="103" fill="#f5eeda" font-family="ui-monospace, monospace" font-size="12">253.18</text>
<text x="176" y="160" fill="#f5eeda" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Match-W hybrid · player</text>
<rect x="190" y="144" width="172.1999999999997" height="24" rx="4" fill="#d9b567" opacity="0.82"/>
<text x="372.1999999999997" y="161" fill="#f5eeda" font-family="ui-monospace, monospace" font-size="12">248.20</text>
<text x="176" y="218" fill="#f5eeda" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Exact-W control · CPU</text>
<rect x="190" y="202" width="457.1699999999996" height="24" rx="4" fill="#7f9187" opacity="0.82"/>
